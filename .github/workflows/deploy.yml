name: Test and deploy

# Tests the dashboard, builds site/data/ from the tracked runs under results/,
# checks the page in a headless browser and deploys site/ to GitHub Pages. A
# failed step deploys nothing, so the page keeps the last good version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # full history: setup changes compare script versions with git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out Ginkgo develop
        uses: actions/checkout@v4
        with:
          repository: ginkgo-project/ginkgo
          ref: develop
          path: ginkgo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - name: Tests
        run: |
          python -m pytest -q tests/test_dash_*.py
          node --test tests/js/*.test.js
      - name: Build the page data
        run: python -m dashboard build --ginkgo ginkgo
      # loads each tab in headless Chrome: no "[object", "null" or missing view
      - name: Check the page in a headless browser
        run: python tests/dom_smoke.py --require-browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
