include = "common.toml"
executor = "cuda"
uenv = "prgenv-gnu/26.3:v1"
arch = "aarch64"
needs_gcc_root = false
sbatch = ["--partition=normal", "--nodes=1", "--exclusive", "--time=04:00:00", "--account=d131"]
# A few of Grace's 72 cores run daemons; CSCS (GROMACS docs) advises at most 64
# OpenMP threads per CPU. The task keeps all 72 so threads avoid the busy ones.
srun = ["--ntasks=1", "--gpus-per-task=1", "--cpus-per-task=72", "--cpu-bind=cores",
        "--export=ALL,OMP_NUM_THREADS=64"]
cmake_flags = [
    "-DGINKGO_BUILD_CUDA=ON",
    "-DGINKGO_CUDA_ARCHITECTURES=90",
    "-DGINKGO_BUILD_HIP=OFF",
    "-DCMAKE_C_COMPILER=gcc",
    "-DCMAKE_CXX_COMPILER=g++",
    "-DCMAKE_CUDA_HOST_COMPILER=g++",
]
# BabelStream (bench/stream.py), built with the same compilers as Ginkgo.
stream_cmake_flags = [
    "-DMODEL=cuda",
    "-DCUDA_ARCH=sm_90",
    "-DCMAKE_CUDA_COMPILER=nvcc",
    "-DCMAKE_CXX_COMPILER=g++",
    "-DCMAKE_CUDA_HOST_COMPILER=g++",
]

# The weekly distributed run (python -m bench distributed): one job of 16 nodes
# runs every GPU count from 1 to 64, one rank per GPU.
[distributed]
nodes = 16
gpus_per_node = 4
# per rank: the single-node srun without --ntasks
srun = ["--gpus-per-task=1", "--cpus-per-task=72", "--cpu-bind=cores",
        "--export=ALL,OMP_NUM_THREADS=64"]
cmake_flags = ["-DGINKGO_BUILD_MPI=ON", "-DGINKGO_FORCE_GPU_AWARE_MPI=ON"]
# mpibench only calls the CUDA runtime, from plain C++
mpibench_cmake_flags = ["-DMPIBENCH_GPU=cuda", "-DCMAKE_CXX_COMPILER=g++"]

[distributed.env]
MPICH_GPU_SUPPORT_ENABLED = "1"
