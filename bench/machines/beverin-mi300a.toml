include = "common.toml"
executor = "hip"
uenv = "prgenv-gnu/25.07-6.3.3:v12"
arch = "x86_64"
needs_gcc_root = true
sbatch = ["--partition=mi300", "--nodes=1", "--exclusive", "--time=04:00:00", "--account=d131"]
# MI300A has 2 threads per core: nomultithread makes -c count cores (it replaces
# --cpu-bind, which would override it). 20 threads leave a few of the 24 cores
# for daemons, as on Daint.
srun = ["--ntasks=1", "--gpus-per-task=1", "--cpus-per-task=24", "--hint=nomultithread",
        "--export=ALL,OMP_NUM_THREADS=20"]
cmake_flags = [
    "-DGINKGO_BUILD_HIP=ON",
    "-DCMAKE_HIP_ARCHITECTURES=gfx942",
    "-DGINKGO_BUILD_CUDA=OFF",
    "-DCMAKE_C_COMPILER={gcc_root}/bin/gcc",
    "-DCMAKE_CXX_COMPILER={gcc_root}/bin/g++",
    "-DCMAKE_HIP_COMPILER=/user-environment/env/default/bin/clang++",
    "-DCMAKE_HIP_FLAGS=--gcc-toolchain={gcc_root}",
]
# BabelStream (bench/stream.py). Its HIP model is plain C++ compiled by hipcc,
# not CMake's HIP language, so the architecture and GCC go in its extra flags.
stream_cmake_flags = [
    "-DMODEL=hip",
    "-DCMAKE_CXX_COMPILER=/user-environment/env/default/bin/hipcc",
    "-DCXX_EXTRA_FLAGS=--offload-arch=gfx942;--gcc-toolchain={gcc_root}",
]
# Ginkgo's syncfree ILU and IC factorizations are 155-310x slower here than on the
# GH200 (87 s against 0.28 s per generate on porous_pressure, 2026-10-18) and time
# out on the 7.3M-row matrices. Back on once that is fixed in Ginkgo.
disabled_preconditioners = ["ilu-syncfree", "ic-syncfree"]
